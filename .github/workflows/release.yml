name: release

# A pushed vX.Y.Z tag is the release. The notes come from CHANGELOG.md, so there
# is one description of what shipped and it lives in the repo.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: test
        run: go vet ./... && go test ./...

      - name: prove the thesis offline
        run: ./demo.sh

      - name: build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch"
            go build -trimpath -ldflags "-s -w" -o "dist/self-$os-$arch" .
            go build -trimpath -ldflags "-s -w" -o "dist/self-serve-$os-$arch" ./cmd/self-serve
            go build -trimpath -ldflags "-s -w" -o "dist/self-browse-$os-$arch" ./cmd/self-browse
          done
          cd dist && sha256sum self-* > SHA256SUMS && cd ..
          ls -la dist

      - name: notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          # The section for this tag, up to the next top-level "## ".
          awk -v tag="$tag" '
            $0 ~ "^## " tag " " || $0 ~ "^## " tag "$" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            printf 'See CHANGELOG.md.\n' > notes.md
          fi
          # The release title is the changelog heading itself.
          title="$(grep -m1 "^## ${tag}" CHANGELOG.md || echo "$tag")"
          echo "title=${title#\#\# }" >> "$GITHUB_OUTPUT"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${{ steps.notes.outputs.title }}" \
            --notes-file notes.md \
            dist/*
