<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zélie et son cheval 🐴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  button { font-family: inherit; cursor: pointer; border: none; }

  /* ------- le menu ------- */
  #menu {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: linear-gradient(#7ec8f0, #cdeafa 60%, #e8d9ae);
    overflow-y: auto; padding: 18px; z-index: 10;
  }
  #menu h1 { color: #2b4a6f; font-size: clamp(28px, 6vw, 52px); text-shadow: 0 2px 0 #fff8; }
  #menu h2 { color: #3d5a80; font-size: clamp(15px, 3vw, 20px); margin-top: 6px; }
  .rangee { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .pastille {
    width: 52px; height: 52px; border-radius: 50%;
    border: 4px solid #ffffffcc; box-shadow: 0 3px 8px #0003;
  }
  .pastille.choisi { border-color: #ff9f1c; transform: scale(1.15); }
  .lieu, .grand {
    background: #ffffffd9; color: #2b4a6f; font-size: clamp(15px, 2.6vw, 19px);
    padding: 10px 20px; border-radius: 999px; box-shadow: 0 3px 8px #0002; font-weight: bold;
  }
  .lieu.choisi { background: #ff9f1c; color: #fff; }
  .grand { background: #2e86de; color: #fff; padding: 14px 26px; }
  .grand:hover { background: #1b6ec2; }
  #robe-nom { color: #3d5a80; font-weight: bold; }

  /* ------- le jeu ------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; display: flex;
    justify-content: space-between; padding: 10px 14px; color: #fff;
    text-shadow: 0 1px 3px #0008; font-size: clamp(14px, 2.6vw, 20px);
    font-weight: bold; pointer-events: none; z-index: 5;
  }
  #hud > div { background: #0003; border-radius: 12px; padding: 6px 12px; }
  #message {
    position: fixed; top: 22%; left: 50%; transform: translateX(-50%) scale(0.8);
    color: #fff; font-size: clamp(22px, 5vw, 40px); font-weight: bold;
    text-shadow: 0 2px 6px #000a; opacity: 0; transition: all .25s; z-index: 5;
    pointer-events: none; white-space: nowrap;
  }
  #message.visible { opacity: 1; transform: translateX(-50%) scale(1); }

  /* ------- les boutons tactiles ------- */
  #tactile { position: fixed; inset: 0; pointer-events: none; z-index: 6; }
  #tactile button {
    position: absolute; pointer-events: auto; user-select: none; touch-action: none;
    background: #ffffff33; color: #fff; border: 3px solid #ffffff88;
    border-radius: 50%; width: 64px; height: 64px; font-size: 26px;
    text-shadow: 0 1px 3px #0008; backdrop-filter: blur(2px);
  }
  #tactile button:active { background: #ffffff66; }
  #t-gauche { left: 16px; bottom: 24px; }
  #t-droite { left: 96px; bottom: 24px; }
  #t-moins  { right: 178px; bottom: 24px; }
  #t-plus   { right: 108px; bottom: 24px; }
  #t-saut {
    right: 14px; bottom: 44px; width: 84px !important; height: 84px !important;
    background: #ff9f1ccc !important; font-size: 17px !important; font-weight: bold;
  }
  #tactile.clavier button { opacity: 0.35; }
  #aide-clavier {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    color: #fff; text-shadow: 0 1px 3px #0008; font-size: 14px; z-index: 5; pointer-events: none;
  }

  /* ------- les résultats ------- */
  #resultats {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #1b3a5add; color: #fff; text-align: center; z-index: 10;
  }
  #res-titre { font-size: clamp(26px, 6vw, 48px); }
  #res-etoiles { font-size: clamp(36px, 9vw, 72px); letter-spacing: 8px; }
  #res-detail { font-size: clamp(15px, 3vw, 22px); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <h1>🐴 Zélie et son cheval</h1>
  <h2>Choisis la couleur de ton cheval : <span id="robe-nom"></span></h2>
  <div class="rangee" id="choix-robe"></div>
  <h2>Choisis l'endroit :</h2>
  <div class="rangee" id="choix-lieu"></div>
  <h2>Choisis ta mission :</h2>
  <div class="rangee" id="choix-mission" style="flex-direction: column;"></div>
</div>

<div id="hud" hidden>
  <div id="mission-nom"></div>
  <div>Sauts : <span id="sauts">0</span></div>
  <div>Fautes : <span id="fautes">0</span></div>
  <div>⏱ <span id="chrono">0.0 s</span></div>
</div>
<div id="message"></div>

<div id="tactile">
  <button id="t-gauche">◀</button>
  <button id="t-droite">▶</button>
  <button id="t-moins">🐢</button>
  <button id="t-plus">🐎</button>
  <button id="t-saut">SAUTE&nbsp;!</button>
</div>
<div id="aide-clavier">⬆️ galoper · ⬇️ ralentir · ⬅️➡️ choisir son chemin · ESPACE sauter</div>

<div id="resultats" hidden>
  <div id="res-titre"></div>
  <div id="res-etoiles"></div>
  <div id="res-detail"></div>
  <button class="grand" id="btn-suivante">Mission suivante ➡️</button>
  <button class="grand" id="btn-rejouer">Rejouer 🔄</button>
  <button class="grand" id="btn-menu">Menu 🏠</button>
</div>

<script>
/* three.js r160 (MIT) — module build réécrit en script classique pour que le
   jeu marche en ouvrant simplement le fichier (file://), sans serveur. */
{{THREE}}
</script>
<script>
{{GAME}}
</script>
</body>
</html>
